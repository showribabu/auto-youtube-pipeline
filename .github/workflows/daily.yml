name: Daily YouTube Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 6:00 UTC (11:30 AM IST)
  workflow_dispatch:      # Allow manual trigger from GitHub UI / API
    inputs:
      category:
        description: 'Specific category to run (or empty for all)'
        required: false
        default: ''
      lang:
        description: 'Specific language (en, hi, te) or empty for all'
        required: false
        default: ''

jobs:
  pipeline-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Indic Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-indic fonts-lohit-telu fonts-lohit-deva
          sudo fc-cache -fv

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FFmpeg & Fonts
        run: |
          ffmpeg -version | head -1
          fc-list :lang=te || true
          fc-list :lang=hi || true

      - name: Run Pipeline
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAX_VIDEOS_PER_DAY: 50
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            LANG_FLAG=""
            if [ -n "${{ github.event.inputs.lang }}" ]; then
              LANG_FLAG="--lang ${{ github.event.inputs.lang }}"
            fi
            python scripts/pipeline.py --category ${{ github.event.inputs.category }} $LANG_FLAG
          else
            python scripts/pipeline.py --run-all
          fi

      - name: Commit Updated Upload Ledger
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/upload_ledger.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update upload ledger [skip ci]" && git push)
