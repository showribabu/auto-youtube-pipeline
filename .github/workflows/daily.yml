name: Daily YouTube Pipeline

on:
  schedule:
    # 4 Automated Daily Broadcasts (UTC):
    - cron: '0 2 * * *'   # 07:30 AM IST (Morning: Devotional, News, Weather, Health & Motivation)
    - cron: '0 7 * * *'   # 12:30 PM IST (Midday: Facts, Recipes, Language Learning)
    - cron: '0 12 * * *'  # 05:30 PM IST (Afternoon: Tech/AI, Crypto, Books, Gaming)
    - cron: '0 15 * * *'  # 08:30 PM IST (Evening: Kids Stories, History, Reflections)
  workflow_dispatch:      # Instant trigger from GitHub UI / API
    inputs:
      category:
        description: 'Specific category to run (or leave empty for all)'
        required: false
        default: ''
      lang:
        description: 'Specific language (en, hi, te) or leave empty for all'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  pipeline-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Multilingual Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-indic fonts-lohit-telu fonts-lohit-deva
          sudo fc-cache -fv

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FFmpeg & Multilingual Fonts
        run: |
          ffmpeg -version | head -1
          fc-list :lang=te || true
          fc-list :lang=hi || true

      - name: Run Pipeline (Generate & Upload Videos to YouTube)
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAX_VIDEOS_PER_DAY: 100
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            LANG_FLAG=""
            if [ -n "${{ github.event.inputs.lang }}" ]; then
              LANG_FLAG="--lang ${{ github.event.inputs.lang }}"
            fi
            python scripts/pipeline.py --category ${{ github.event.inputs.category }} $LANG_FLAG
          else
            python scripts/pipeline.py --run-all
          fi

      - name: Commit Updated Upload Ledger
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add output/upload_ledger.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update upload ledger [skip ci]" && git push)
