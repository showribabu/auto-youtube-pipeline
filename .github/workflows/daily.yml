name: Daily YouTube Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 6:00 UTC (2am EST / 7am IST)
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      - run: sudo cp -r assets/dejavu-fonts-ttf-2.37/ttf/*.ttf /usr/share/fonts/truetype/dejavu/ && sudo fc-cache -fv
      - run: ffmpeg -version | head -1
      - name: Run pipeline (full upload)
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          source venv/bin/activate
          python scripts/pipeline.py --run-all
      - run: echo "Daily pipeline execution completed successfully"
